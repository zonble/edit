[package]
name = "ze2-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[features]
# Declared because this crate includes ze2's draw_statusbar.rs, which gates a
# latency overlay on this cfg; without it check-cfg flags the value as unknown.
debug-latency = []

[dependencies]
stdext.workspace = true
ze2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
toml-span = { version = "0.7", default-features = false }
